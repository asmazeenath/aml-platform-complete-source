services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: aml, POSTGRES_USER: aml, POSTGRES_PASSWORD: aml}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U aml -d aml"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7
    ports: ["6379:6379"]
  kafka:
    image: redpandadata/redpanda:latest
    command: ["redpanda","start","--overprovisioned","--smp","1","--memory","1G","--reserve-memory","0M","--node-id","0","--check=false","--kafka-addr","0.0.0.0:9092","--advertise-kafka-addr","localhost:9092"]
    ports: ["9092:9092","9644:9644"]
  api:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://aml:aml@postgres:5432/aml
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  web:
    image: node:20
    working_dir: /workspace
    volumes: ["./apps/web:/workspace"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment: {VITE_API_URL: http://localhost:8000}
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
